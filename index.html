<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>Orbit · 생각이 머무는 곳</title><link rel="stylesheet" href="style.css"></head><body><div id="cape-fold" aria-hidden="true"></div>
<header><div class="brand"><span class="logo">✳</span> orbit <span class="divider"></span><span class="sub">생각이 머무는 곳</span></div><div class="actions"><span id="saved">로컬에 저장됨</span><select id="mode" aria-label="대화 모드"><option value="demo">✧ 데모 답변</option><option value="auto">✦ Claude · 자동 연결</option><option value="desktop">↗ 데스크톱 앱 · 수동 연결</option></select><button id="connect" hidden>연결 확인</button><button id="cancel" hidden>수신 취소</button><button id="hide" title="접기 · Esc">접기 ↘</button></div></header>
<main id="canvas"><div class="intro"><div class="eyebrow">YOUR LITTLE SPACE FOR BIG IDEAS</div><h1>하나의 호기심에서,<br><em>생각의 우주로.</em></h1><p>빈 곳을 드래그해 생각을 담아 보세요.<br>질문을 연결하면, 새로운 방향이 보일 거예요.</p></div><div id="world"><svg id="links"></svg><div id="nodes"></div></div><div id="selection"></div></main>
<div class="legend"><i></i> 나의 질문 <i></i> 생각의 가지 <span>선택한 카드에서 다음 질문이 이어집니다</span></div>
<footer><div class="tools"><button id="select" class="active" title="카드 이동 / 캔버스 이동">↖ <span>선택</span></button><button id="draw" title="드래그로 질문 만들기">▧ <span>질문 그리기</span></button><span class="divider"></span><button id="add">＋ <span>새 주제</span></button></div><div class="tips" id="tip"><kbd>Ctrl W</kbd> 카드 삭제 <kbd>Ctrl C</kbd> 카드 복사</div><div class="tools"><button id="out" aria-label="축소">−</button><span id="zoom">100%</span><button id="in" aria-label="확대">＋</button><button id="home" title="화면 맞춤">⌖</button></div></footer>
<div id="toast" role="status"></div><script src="app.js"></script></body></html>
