<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>Orbit · 생각이 머무는 곳</title><link rel="stylesheet" href="style.css"></head><body><div id="cape-fold" aria-hidden="true"></div>
<header><div class="brand"><span class="logo">✳</span> orbit <span class="divider"></span><span class="sub">생각이 머무는 곳</span></div><div class="actions"><span id="saved">로컬에 저장됨</span><button id="usage" title="플랜 한도와 이 지도의 토큰 사용량">사용량</button><select id="mode" aria-label="AI 연결" title="이 지도의 질문을 보낼 AI. 설치·로그인된 것만 선택할 수 있습니다."><option value="demo">✧ 데모 답변</option></select><button id="connect" hidden>연결 확인</button><button id="cancel" hidden>수신 취소</button><button id="hide" title="접기 · Esc">접기 ↘</button></div></header>
<main id="canvas"><div class="intro"><div class="eyebrow">YOUR LITTLE SPACE FOR BIG IDEAS</div><h1>하나의 호기심에서,<br><em>생각의 우주로.</em></h1><p><kbd>Ctrl</kbd>을 누른 채 빈 곳을 드래그해 생각을 담아 보세요.<br>그냥 드래그하면 화면이 움직이고, 질문을 연결하면 새로운 방향이 보일 거예요.</p></div><div id="world"><svg id="links"></svg><div id="nodes"></div></div><div id="selection"></div></main>
<div class="legend"><i></i> 나의 질문 <i></i> 생각의 가지 <span>선택한 카드에서 다음 질문이 이어집니다</span></div>
<footer><div class="tools"><button id="select" class="active" title="드래그: 화면 이동 · Ctrl+드래그: 카드 생성">↖ <span>선택</span></button><button id="draw" title="드래그만으로 질문 카드 만들기">▧ <span>질문 그리기</span></button><span class="divider"></span><button id="add">＋ <span>새 주제</span></button></div><div class="tips" id="tip"><kbd>Ctrl</kbd>+드래그 카드 생성 · 드래그/휠 화면 이동 · <kbd>Ctrl</kbd>+휠 확대 <kbd>Ctrl W</kbd> 삭제 <kbd>Ctrl C</kbd> 복사</div><div class="tools"><button id="out" aria-label="축소">−</button><span id="zoom">100%</span><button id="in" aria-label="확대">＋</button><button id="home" title="화면 맞춤">⌖</button></div></footer>
<div id="usage-panel" hidden><div class="row head"><strong>사용량</strong><button id="usage-refresh" title="다시 읽기">⟳</button><button id="usage-close" title="닫기">×</button></div><div id="usage-body"></div></div><div id="toast" role="status"></div><script src="app.js"></script></body></html>
